name: StretchBreak
options:
  bundleIdPrefix: com.sharonyang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  StretchBreak:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: StretchBreak
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # YouTube Data API v3 key (optional). Read from $YT_API_KEY at generate time —
        # set it in .env.local (gitignored, see .env.local.example) and run:
        #   export $(cat .env.local | xargs) && xcodegen generate
        # Leave unset to use the built-in offline routine + any YouTube links added in Settings.
        YTAPIKey: "${YT_API_KEY}"
        CFBundleIcons:
          CFBundleAlternateIcons:
            AppIcon-Pink:
              CFBundleIconFiles:
                - AppIcon-Pink
              UIPrerenderedIcon: false
            AppIcon-Latte:
              CFBundleIconFiles:
                - AppIcon-Latte
              UIPrerenderedIcon: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharonyang.stretchbreak
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Set your Apple Team ID to run on a physical device:
        DEVELOPMENT_TEAM: ""
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          ENABLE_TESTABILITY: YES

  StretchBreakTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: StretchBreak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharonyang.stretchbreak.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
